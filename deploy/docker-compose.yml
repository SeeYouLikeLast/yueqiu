services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    container_name: hm-badminton-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: hm_badminton
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-redis:7.4}
    container_name: hm-badminton-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rocketmq-namesrv:
    image: ${ROCKETMQ_IMAGE:-apache/rocketmq:5.3.2}
    container_name: hm-badminton-rocketmq-namesrv
    restart: unless-stopped
    user: root
    ports:
      - "9876:9876"
    environment:
      TZ: Asia/Shanghai
    command: sh mqnamesrv
    volumes:
      - rocketmq-namesrv-logs:/home/rocketmq/logs

  rocketmq-broker:
    image: ${ROCKETMQ_IMAGE:-apache/rocketmq:5.3.2}
    container_name: hm-badminton-rocketmq-broker
    restart: unless-stopped
    user: root
    depends_on:
      - rocketmq-namesrv
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      TZ: Asia/Shanghai
      JAVA_OPT_EXT: "-server -Xms256m -Xmx256m -Xmn128m"
    command: sh mqbroker -c /home/rocketmq/conf/broker.conf
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
      - rocketmq-broker-logs:/home/rocketmq/logs
      - rocketmq-broker-store:/home/rocketmq/store

  rocketmq-init:
    image: ${ROCKETMQ_IMAGE:-apache/rocketmq:5.3.2}
    container_name: hm-badminton-rocketmq-init
    depends_on:
      - rocketmq-broker
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
    entrypoint: >
      /bin/sh -c "
      sleep 15;
      sh mqadmin updateTopic -n rocketmq-namesrv:9876 -b rocketmq-broker:10911 -t hm-seckill-order || true;
      sh mqadmin updateSubGroup -n rocketmq-namesrv:9876 -b rocketmq-broker:10911 -g hm-seckill-order-consumer || true
      "

  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:latest}
    container_name: hm-badminton-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

  minio-init:
    image: ${MINIO_CLIENT_IMAGE:-quay.io/minio/mc:latest}
    container_name: hm-badminton-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-hm-badminton}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
        echo 'waiting for minio...';
        sleep 2;
      done;
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      mc anonymous set download local/$$MINIO_BUCKET
      "

volumes:
  mysql-data:
  redis-data:
  rocketmq-namesrv-logs:
  rocketmq-broker-logs:
  rocketmq-broker-store:
  minio-data:
