brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH

namesrvAddr=rocketmq-namesrv:9876
listenPort=10911
# Spring Boot 运行在 ECS 宿主机，通过本机映射端口访问 Broker。
brokerIP1=127.0.0.1

# 轻量演示环境只允许部署脚本创建明确需要的 Topic 和消费者组。
autoCreateTopicEnable=false
autoCreateSubscriptionGroup=false
defaultTopicQueueNums=1

storePathRootDir=/home/rocketmq/store
storePathCommitLog=/home/rocketmq/store/commitlog
storePathConsumeQueue=/home/rocketmq/store/consumequeue
storePathIndex=/home/rocketmq/store/index
storeCheckpoint=/home/rocketmq/store/checkpoint
abortFile=/home/rocketmq/store/abort

deleteWhen=04
fileReservedTime=12
diskMaxUsedSpaceRatio=88
maxMessageSize=1048576

# 缩小内存映射文件并关闭消息索引。秒杀消息很小，演示环境不需要按 key 查询消息。
mappedFileSizeCommitLog=67108864
mappedFileSizeConsumeQueue=300000
messageIndexEnable=false
# 本项目不使用延迟消息，关闭时间轮可避免为 TimerWheel 分配较大的直接内存。
timerWheelEnable=false

# 减少低并发演示环境中的线程数量，降低线程栈和上下文切换开销。
sendMessageThreadPoolNums=2
pullMessageThreadPoolNums=2
processReplyMessageThreadPoolNums=1
queryMessageThreadPoolNums=1
adminBrokerThreadPoolNums=1
clientManageThreadPoolNums=1
consumerManageThreadPoolNums=1
heartbeatThreadPoolNums=1
endTransactionThreadPoolNums=1
serverWorkerThreads=2
serverSelectorThreads=1
clientWorkerThreads=2
clientCallbackExecutorThreads=1
