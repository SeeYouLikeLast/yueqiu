services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    container_name: hm-badminton-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: hm_badminton
      TZ: Asia/Shanghai
    ports:
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    # MySQL 8.4 needs extra memory while initializing its data dictionary.
    # A lower limit can cause an OOM/restart loop even with a small buffer pool.
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-redis:7.4}
    container_name: hm-badminton-redis
    restart: unless-stopped
    ports:
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:6379:6379"
    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rocketmq-namesrv:
    image: ${ROCKETMQ_IMAGE:-apache/rocketmq:5.3.2}
    container_name: hm-badminton-rocketmq-namesrv
    restart: unless-stopped
    profiles: ["mq"]
    user: root
    ports:
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:9876:9876"
    environment:
      TZ: Asia/Shanghai
      JAVA_OPT_EXT: >-
        -server -Xms32m -Xmx48m -Xmn16m -Xss256k
        -XX:MaxDirectMemorySize=16m -XX:MaxMetaspaceSize=48m
        -XX:ReservedCodeCacheSize=24m
    command: sh mqnamesrv
    mem_limit: 128m
    volumes:
      - rocketmq-namesrv-logs:/home/rocketmq/logs

  rocketmq-broker:
    image: ${ROCKETMQ_IMAGE:-apache/rocketmq:5.3.2}
    container_name: hm-badminton-rocketmq-broker
    restart: unless-stopped
    profiles: ["mq"]
    user: root
    depends_on:
      - rocketmq-namesrv
    ports:
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:10909:10909"
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:10911:10911"
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:10912:10912"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      TZ: Asia/Shanghai
      JAVA_OPT_EXT: >-
        -server -Xms64m -Xmx96m -Xmn32m -Xss256k
        -XX:MaxDirectMemorySize=24m -XX:MaxMetaspaceSize=64m
        -XX:ReservedCodeCacheSize=32m -XX:-AlwaysPreTouch
    command: sh mqbroker -c /home/rocketmq/conf/broker.conf
    mem_limit: 256m
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
      - rocketmq-broker-logs:/home/rocketmq/logs
      - rocketmq-broker-store:/home/rocketmq/store

  rocketmq-init:
    image: ${ROCKETMQ_IMAGE:-apache/rocketmq:5.3.2}
    container_name: hm-badminton-rocketmq-init
    profiles: ["mq"]
    depends_on:
      - rocketmq-broker
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
    mem_limit: 192m
    entrypoint: >
      /bin/sh -ec "
      sleep 5;
      /opt/java/openjdk/bin/java
      -Xms16m -Xmx48m -Xmn16m -Xss256k
      -XX:MaxDirectMemorySize=16m -XX:MaxMetaspaceSize=48m -XX:ReservedCodeCacheSize=24m
      -cp '.:/home/rocketmq/rocketmq-5.3.2/conf:/home/rocketmq/rocketmq-5.3.2/lib/*'
      org.apache.rocketmq.tools.command.MQAdminStartup
      updateTopic -n rocketmq-namesrv:9876 -b rocketmq-broker:10911 -t hm-seckill-order -r 1 -w 1;
      /opt/java/openjdk/bin/java
      -Xms16m -Xmx48m -Xmn16m -Xss256k
      -XX:MaxDirectMemorySize=16m -XX:MaxMetaspaceSize=48m -XX:ReservedCodeCacheSize=24m
      -cp '.:/home/rocketmq/rocketmq-5.3.2/conf:/home/rocketmq/rocketmq-5.3.2/lib/*'
      org.apache.rocketmq.tools.command.MQAdminStartup
      updateSubGroup -n rocketmq-namesrv:9876 -b rocketmq-broker:10911 -g hm-seckill-order-consumer
      "

  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:latest}
    container_name: hm-badminton-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      TZ: Asia/Shanghai
    ports:
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:9000:9000"
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    mem_limit: 192m

  minio-init:
    image: ${MINIO_CLIENT_IMAGE:-quay.io/minio/mc:latest}
    container_name: hm-badminton-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-hm-badminton}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
        echo 'waiting for minio...'; sleep 2;
      done;
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      mc anonymous set download local/$$MINIO_BUCKET
      "

volumes:
  mysql-data:
  redis-data:
  rocketmq-namesrv-logs:
  rocketmq-broker-logs:
  rocketmq-broker-store:
  minio-data:
