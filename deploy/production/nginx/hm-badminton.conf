proxy_cache_path /var/cache/nginx/hm-media
    levels=1:2
    keys_zone=hm_media:16m
    max_size=512m
    inactive=30d
    use_temp_path=off;

# 证书签发与 HTTP 访问统一跳转到 HTTPS。申请 IP 证书时，Certbot 会在此目录写入 ACME 校验文件。
server {
    listen 80;
    server_name your-domain.example;

    root /var/www/hm-badminton;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name your-domain.example;

    # IP 证书的默认目录为 /etc/letsencrypt/live/<公网 IP>/。
    # 使用域名证书时，将这里替换为对应域名目录即可。
    ssl_certificate /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/hm-badminton;
    index index.html;
    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 兼容历史文件地址。文件 id 对应不可变对象，首次回源后由 Nginx 和浏览器缓存。
    location ~ ^/api/files/[0-9]+/download$ {
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_buffering on;
        proxy_cache hm_media;
        proxy_cache_lock on;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Media-Cache $upstream_cache_status always;
    }

    # 前端始终访问 /api，Nginx 转发给仅监听 127.0.0.1 的 Spring Boot。
    location /api/ {
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # MinIO 的对象文件经网站域名输出；9000 不需要暴露公网。
    location /objects/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering on;
        proxy_cache hm_media;
        proxy_cache_lock on;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Media-Cache $upstream_cache_status always;
    }
}
