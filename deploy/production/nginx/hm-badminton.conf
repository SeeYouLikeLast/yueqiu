proxy_cache_path /var/cache/nginx/hm-media
    levels=1:2
    keys_zone=hm_media:16m
    max_size=512m
    inactive=30d
    use_temp_path=off;

# 证书签发与 HTTP 访问统一跳转到 HTTPS。申请 IP 证书时，Certbot 会在此目录写入 ACME 校验文件。
server {
    listen 80;
    server_name your-domain.example;

    root /var/www/hm-badminton;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name your-domain.example;

    # IP 证书的默认目录为 /etc/letsencrypt/live/<公网 IP>/。
    # 使用域名证书时，将这里替换为对应域名目录即可。
    ssl_certificate /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/hm-badminton;
    index index.html;
    client_max_body_size 20m;

    # SPA 入口不能长期缓存，否则发布新版后浏览器仍可能引用旧的资源哈希。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Vite 资源名包含内容哈希，可以安全地长期缓存。
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # 兼容历史文件地址。文件 id 对应不可变对象，首次回源后由 Nginx 和浏览器缓存。
    location ~ ^/api/files/[0-9]+/download$ {
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_buffering on;
        proxy_cache hm_media;
        proxy_cache_lock on;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Media-Cache $upstream_cache_status always;
    }

    # SSE 必须关闭代理缓冲，否则浏览器会等到回答结束后才一次性收到所有进度。
    location = /api/agent/chat/stream {
        proxy_pass http://127.0.0.1:8088/agent/chat/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_unavailable;
        add_header X-Accel-Buffering no always;
    }

    # 前端始终访问 /api，Nginx 转发给仅监听 127.0.0.1 的 Spring Boot。
    location /api/ {
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_unavailable;
    }

    # Do not expose Nginx's HTML error page when Spring Boot is restarting.
    location @api_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"code":503,"message":"服务正在启动或暂时不可用，请稍后重试","data":null}';
    }

    # MinIO 的对象文件经网站域名输出；9000 不需要暴露公网。
    location /objects/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering on;
        proxy_cache hm_media;
        proxy_cache_lock on;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Media-Cache $upstream_cache_status always;
    }
}
