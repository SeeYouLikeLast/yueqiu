server:
  port: 8088

spring:
  application:
    name: hm-badminton
  ai:
    model:
      chat: dashscope
    dashscope:
      enabled: ${AI_DASHSCOPE_ENABLED:false}
      api-key: ${AI_DASHSCOPE_API_KEY:}
      chat:
        options:
          model: ${AI_MODEL:qwen-plus}
          temperature: 0.3
          max-tokens: 1200
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3307/hm_badminton?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 2
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  mail:
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtps
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

hm:
  auth:
    code-expire-minutes: 5
    code-cooldown-seconds: 60
    code-window-minutes: 10
    code-window-limit: 5
    token-expire-minutes: 120
    token-expire-jitter-minutes: 10
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-prod-hm-badminton-2026}
    expire-minutes: 120
  bloom:
    bit-size: 33554432
    hash-count: 7
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin123}
    bucket: ${MINIO_BUCKET:hm-badminton}
  amap:
    key: ${AMAP_KEY:0b3dedfd34e183c63be3e7206dc5560c}
    endpoint: https://restapi.amap.com/v5/place/around
    default-city: 西安
    radius: 5000
    page-size: 20
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
  agent:
    enabled: true
    memory-ttl-minutes: 60
    rate-limit-per-minute: 10
    tool-timeout-seconds: 5
    tool-threads: 6
    # 游客历史按浏览器匿名 Cookie 隔离，只保存在 Redis，过期后自动清理。
    anonymous-history-ttl-days: 7
    anonymous-max-conversations: 30
    anonymous-max-messages-per-conversation: 100
    # 轻量 RAG：MySQL 保存原文，Redis 缓存向量；Embedding 不可用时回退到关键词检索。
    rag-enabled: true
    rag-embedding-enabled: ${AI_RAG_EMBEDDING_ENABLED:true}
    rag-candidate-limit: 48
    rag-top-k: 3
    rag-embedding-cache-days: 7
  seckill:
    # 默认优先 RocketMQ 异步落库；MQ 未部署或投递失败时可降级为同步事务落库。
    mq-enabled: ${SECKILL_MQ_ENABLED:true}
    sync-fallback-enabled: ${SECKILL_SYNC_FALLBACK_ENABLED:true}

logging:
  level:
    com.hm.badminton: INFO

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: hm-seckill-order-producer
    send-message-timeout: 3000
