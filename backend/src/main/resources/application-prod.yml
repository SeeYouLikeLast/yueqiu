# 生产环境不能在每次进程重启时执行 schema.sql 和 data.sql。
# 演示数据仅应在首次部署时人工初始化一次。
server:
  address: 127.0.0.1
  # Nginx 负责 TLS 终止，Spring 需要据此识别原始 HTTPS 请求，避免将同源 POST 误判为跨域。
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  sql:
    init:
      mode: never

hm:
  # 生产环境不允许回退到 application.yml 的开发凭据；缺少变量时直接启动失败。
  jwt:
    secret: ${JWT_SECRET}
  minio:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET}
  amap:
    key: ${AMAP_KEY}
  cors:
    # 多个地址可用英文逗号分隔，例如 https://your-domain.example,https://121.40.140.135。
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://121.40.140.135}
